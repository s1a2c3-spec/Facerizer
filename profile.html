<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My grooming profile | Facerizer</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/auth.css">
<link rel="stylesheet" href="/account.css">
<link rel="stylesheet" href="/report.css">
<link rel="stylesheet" href="/recs.css">
<link rel="stylesheet" href="/profile.css">
<script>try{var t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-theme",t)}}catch(e){}</script>
<script src="/script.js" defer></script>
</head>
<body data-page="profile">
<div class="dash">
  <header class="dash-top">
    <a href="/" class="logo" aria-label="Facerizer home"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#12303A"/><ellipse cx="32" cy="32" rx="14" ry="19" fill="none" stroke="#5FD3C0" stroke-width="3"/><line x1="32" y1="10" x2="32" y2="54" stroke="#5FD3C0" stroke-width="2" stroke-dasharray="3 4"/></svg><span>Facerizer</span></a>
    <div class="top-right">
      <button type="button" id="theme-toggle" class="btn btn-outline icon-btn" aria-label="Switch theme">◐</button>
      <a href="/account" class="btn btn-outline btn-sm">Dashboard</a>
    </div>
  </header>

  <main>
    <p id="state" class="card-text" style="margin-top:2rem" role="status">Loading your profile...</p>
    <div id="pf" class="pf" hidden>
      <section class="dash-hero">
        <div>
          <h1 id="pf-title"></h1>
          <p class="sub" id="pf-sub"></p>
        </div>
      </section>
      <div id="pf-form" class="pf-form"></div>
      <p class="pf-fine" id="pf-fine"></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/translations.js"></script>
<script src="/profile.js"></script>
<script src="/menu.js" defer></script>
</body>
</html>
