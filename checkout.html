<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Checkout | Facerizer</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/auth.css">
<link rel="stylesheet" href="/account.css">
<link rel="stylesheet" href="/checkout.css">
<script>try{var t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-theme",t)}}catch(e){}</script>
<script src="/script.js" defer></script>
</head>
<body data-page="checkout">
<div class="dash">
  <header class="dash-top">
    <a href="/" class="logo" aria-label="Facerizer home"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#12303A"/><ellipse cx="32" cy="32" rx="14" ry="19" fill="none" stroke="#5FD3C0" stroke-width="3"/><line x1="32" y1="10" x2="32" y2="54" stroke="#5FD3C0" stroke-width="2" stroke-dasharray="3 4"/></svg><span>Facerizer</span></a>
    <div class="top-right">
      <button type="button" id="theme-toggle" class="btn btn-outline icon-btn" aria-label="Switch theme">◐</button>
      <a href="/account" class="btn btn-outline btn-sm">Dashboard</a>
    </div>
  </header>

  <main class="co">
    <p id="state" class="card-text" style="margin-top:2rem">Loading...</p>

    <div id="chooser" hidden class="co-card">
      <h1>Choose a plan</h1>
      <p class="card-text">Pick the plan you want to buy.</p>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem">
        <a class="btn btn-primary" href="/checkout?plan=pro">Pro, from &#8377;399</a>
        <a class="btn btn-outline" href="/checkout?plan=premium">Premium, from &#8377;699</a>
      </div>
    </div>

    <div id="box" hidden>
      <div class="co-card" id="card">
        <h1 id="co-title">Pro plan</h1>
        <div class="co-seg" role="group" aria-label="Period">
          <button type="button" id="p-month" class="on">1 month</button>
          <button type="button" id="p-year">1 year</button>
        </div>
        <div class="co-price" id="co-price">&#8377;399</div>
        <div class="co-save" id="co-save"></div>
        <ul class="co-list" id="co-list"></ul>
        <div class="co-info" id="co-info" hidden></div>
        <div class="co-test" id="co-test" hidden></div>
        <button type="button" id="pay" class="btn btn-primary btn-lg co-pay">Pay securely</button>
        <p id="msg" class="msg" role="status" aria-live="polite" style="margin-top:.75rem"></p>
        <p class="co-fine" id="co-fine"></p>
        <p class="co-other" id="co-other"></p>
      </div>
    </div>

    <div id="done" hidden class="co-card">
      <h1>Payment received</h1>
      <p class="card-text" id="done-text"></p>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.25rem">
        <a class="btn btn-primary" href="/account">Go to my dashboard</a>
        <a class="btn btn-outline" href="/analyze/">Analyze my face</a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/checkout.js"></script>
</body>
</html>
